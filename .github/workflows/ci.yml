name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI never depends on Iranian or foreign APIs.
      DATA_MODE: mock
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm format:check

      - run: pnpm check

  mock-server-image:
    name: Mock server Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f apps/mock-server/Dockerfile -t nerkh-mock-server .

      - name: Start container and check /health
        run: |
          docker run -d --name mock -p 4000:4000 nerkh-mock-server
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs mock
          exit 1
